name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
    branches: [main]   # ← tests always run on every PR to main
  push:
    branches: [main]   # ← publish :latest only when Dockerfile changes
    paths:
    - ".github/ci/Dockerfile"

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  # 1) Detect if the Dockerfile changed (on PRs)
  changes:
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          dockerfile:
            - ".github/ci/Dockerfile"

  # 2) Build & (optionally) push a PR image only if Dockerfile changed
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  build-image:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      pushed: ${{ steps.push-flag.outputs.push }}
      image: ${{ steps.compute.outputs.image }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
    - name: Determine whether to build
      id: should-build
      env:
        EVENT_NAME: ${{ github.event_name }}
        DOCKERFILE_CHANGED: ${{ needs.changes.outputs.dockerfile }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork || 'false' }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$DOCKERFILE_CHANGED" = "true" ] && [ "$IS_FORK" = "false" ]; then
          echo "build=true" >> $GITHUB_OUTPUT
        else
          echo "build=false" >> $GITHUB_OUTPUT
        fi

    - uses: crashappsec/action-checkout@main
      if: steps.should-build.outputs.build == 'true'
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Compute image ref
      id: compute
      run: |
        echo "image=ghcr.io/patham9/petta-ci" >> $GITHUB_OUTPUT
        echo "tag=pr-${{ github.event.number || github.run_id }}" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      if: steps.should-build.outputs.build == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Buildx
      if: steps.should-build.outputs.build == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build (and push if allowed)
      if: steps.should-build.outputs.build == 'true'
      id: build-and-push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: .github/ci/Dockerfile
        tags: ${{ steps.compute.outputs.image }}:${{ steps.compute.outputs.tag }}
        push: false     # racecar: build only, never push
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Record push result
      if: ${{ always() }}
      id: push-flag
      env:
        SHOULD_BUILD: ${{ steps.should-build.outputs.build }}
        BUILD_OUTCOME: ${{ steps.build-and-push.outcome }}
      run: |
        if [ "$SHOULD_BUILD" = "true" ] && [ "$BUILD_OUTCOME" = "success" ]; then
          echo "push=true" >> $GITHUB_OUTPUT
        else
          echo "push=false" >> $GITHUB_OUTPUT
        fi

  # 3) Resolve which image to use for tests:
  #    - If we built & pushed a PR image, use that
  #    - Otherwise, use the published :latest
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
