            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  publish-latest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: .github/ci/Dockerfile
        tags: ghcr.io/patham9/petta-ci:latest
        push: false     # racecar: build only, never push
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Check observables and crashes
